schema_version: 1
project: aces-scenario-workbench
github_repo: Brad-Edwards/aces-scenario-workbench
workflow:
  test_command: uv run pytest
  completion_command: uv run pytest
  lint_command: uv run ruff check .
  format_command: uv run ruff format .
  codex_review:
    pre_push_cap: 1
  review_disposition:
    enabled: false
    mode: shadow
    max_auto_overrides: 0
    judge:
      enabled: false
docs:
  adr_dir: docs/decisions/adrs/
example_paths:
  source: prototype/
  test: tests/
requirements:
  uid_examples:
    - WB-001
    - ADR-001
routing:
  enabled: true
  default_provider: claude
  default_fallback: parent
  stages: {}
sonarcloud:
  project_key: Brad-Edwards_aces-scenario-workbench
  organization: brad-edwards
rules:
  plan_rules: .gc/plan-rules.md
